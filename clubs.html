// =====================================================
// DISTANCE BETWEEN TWO LOCATIONS
// =====================================================

function cityDistance(lat1, lon1, lat2, lon2) {

const R = 6371;

const dLat =
    (lat2 - lat1) * Math.PI / 180;

const dLon =
    (lon2 - lon1) * Math.PI / 180;

const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(lat1 * Math.PI / 180) *
    Math.cos(lat2 * Math.PI / 180) *
    Math.sin(dLon / 2) ** 2;

return R * 2 *
    Math.atan2(
        Math.sqrt(a),
        Math.sqrt(1 - a)
    );
}

let shortestDistance = Infinity;

Object.entries(cityCoordinates).forEach(
    ([city, coordinates]) => {

        const distance = cityDistance(
            latitude,
            longitude,
            coordinates[0],
            coordinates[1]
        );

        if (distance < shortestDistance) {

            shortestDistance = distance;
            nearestCity = city;

        }

    }
);

return {
    city: nearestCity,
    distance: shortestDistance
};

        /*
        ==================================================
        DISPLAY
        ==================================================
        */

        const clubList = document.getElementById("clubList");
        const seeMoreBtn = document.getElementById("seeMoreBtn");
        const searchBox = document.getElementById("searchBox");

        let visibleCount = 8;


        function createMapURL(query) {

            return "https://www.google.com/maps/search/?api=1&query="
                + encodeURIComponent(query);

        }

        function createEmbedMapURL(query) {

            return "https://maps.google.com/maps?q="
                + encodeURIComponent(query)
                + "&t=&z=14&ie=UTF8&iwloc=&output=embed";

        }


        function displayClubs(data) {

            clubList.innerHTML = "";

            if (data.length === 0) {

                clubList.innerHTML =
                    '<div class="empty">কোনো Puja Club পাওয়া যায়নি।</div>';

                seeMoreBtn.style.display = "none";

                return;
            }


            const visibleClubs = data.slice(0, visibleCount);


            visibleClubs.forEach(club => {

                const card = document.createElement("div");

                card.className = "club-card";

                card.innerHTML = `

                    <div class="club-name">
                         ${club.name}
                    </div>

                    <div class="club-area">
                         ${club.area}, ${club.city}
                    </div>

                    <div class="map-embed-wrapper" style="margin: 12px 0; border-radius: 10px; overflow: hidden; height: 160px; background: rgba(0,0,0,0.06); box-shadow: inset 0 0 4px rgba(0,0,0,0.1);">
                        <iframe
                            title="${club.name} Map"
                            width="100%"
                            height="160"
                            style="border:0; display: block;"
                            loading="lazy"
                            allowfullscreen
                            referrerpolicy="no-referrer-when-downgrade"
                            src="${createEmbedMapURL(club.query)}"
                        ></iframe>
                    </div>

                    <a
                        class="map-btn"
                        href="${createMapURL(club.query)}"
                        target="_blank"
                    >
                        Google Maps →
                    </a>

                `;

                clubList.appendChild(card);

            });


            if (visibleCount >= data.length) {

                seeMoreBtn.style.display = "none";

            } else {

                seeMoreBtn.style.display = "block";

            }

        }


        /*
        ==================================================
        SEE MORE
        ==================================================
        */

        seeMoreBtn.addEventListener("click", () => {

            visibleCount += 8;

            displayClubs(clubs);

        });


        /*
        ==================================================
        SEARCH
        ==================================================
        */

        searchBox.addEventListener("input", () => {

            const text =
                searchBox.value.toLowerCase().trim();


            if (!text) {

                visibleCount = 8;

                displayClubs(clubs);

                return;

            }


            const filtered = clubs.filter(club => {

                return (

                    club.name.toLowerCase().includes(text) ||

                    club.area.toLowerCase().includes(text) ||

                    club.city.toLowerCase().includes(text)

                );

            });


            visibleCount = filtered.length;

            displayClubs(filtered);

        });


        /*
        ==================================================
        INITIAL LOAD
        ==================================================
        */
        navigator.geolocation.getCurrentPosition(
    function(position) {
        console.log("User location:", 
            position.coords.latitude,
            position.coords.longitude
        );
    },
    function(error) {
        console.log("Location permission denied.");
    }
);
        displayClubs(clubs);
        

    </script>
